<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3a8f">
<title>JS TASKER PRO</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toasts"></div>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__ip=e});window.addEventListener("appinstalled",function(){window.__ip=null});if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script>
<script src="firebase-config.js"></script>
<script src="core.js"></script>
<script src="backend-firebase.js"></script>
<script src="user.js"></script>
<script>
if(!window.Backend.configured){document.getElementById('app').innerHTML='<div style="padding:40px 20px;text-align:center;font-family:sans-serif"><h2>Setup required</h2><p>Open <b>firebase-config.js</b> and paste your Firebase config (see README).</p></div>'}
else UserApp.mount(document.getElementById('app'),window.Backend);
</script>
</body>
</html>
